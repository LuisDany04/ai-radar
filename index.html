<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Radar</title>
<meta name="description" content="Panel de lectura sobre IA aplicada al desarrollo: Claude Code, Agent Skills, MCP, modelos, herramientas y prácticas, con fuentes fechadas y verificadas.">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='4' fill='%236ea8fe'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%236ea8fe' stroke-opacity='.55' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='15' fill='none' stroke='%236ea8fe' stroke-opacity='.25' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div id="app">

  <header class="top">
    <div class="brand" title="Volver al panorama">
      <span class="dot"></span>
      AI Radar
      <small id="stamp"></small>
    </div>

    <div class="search-wrap">
      <span class="icon">⌕</span>
      <input id="q" type="search" placeholder="Buscar en todo el contenido…" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </div>

    <div class="top-actions">
      <button id="btn-home" data-view="home" type="button">Panorama</button>
      <button id="btn-sources" data-view="sources" type="button">Fuentes</button>
      <button id="btn-about" data-view="about" type="button">Cómo se hizo</button>
      <button id="btn-theme" type="button" title="Cambiar tema">◐</button>
    </div>
  </header>

  <div class="mobile-tabs">
    <button data-pane="side" type="button">Filtros</button>
    <button data-pane="list" type="button">Fichas</button>
    <button data-pane="reader" type="button">Lectura</button>
  </div>

  <main class="cols" data-mobile="list">
    <nav class="side"></nav>
    <section class="list"></section>
    <section class="reader"></section>
  </main>

</div>

<script src="assets/md.js"></script>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
